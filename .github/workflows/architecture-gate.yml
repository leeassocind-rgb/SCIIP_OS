name: SCIIP Architecture Gate
on:
  push:
  pull_request:
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run architecture:test
      - run: npm run architecture:report
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sciip-architecture-report
          path: governance/architecture-report.json
