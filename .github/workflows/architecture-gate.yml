name: SCIIP Architecture Gate
on:
  workflow_dispatch:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run architecture:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sciip-architecture-report
          path: governance/architecture-governance-report.json
