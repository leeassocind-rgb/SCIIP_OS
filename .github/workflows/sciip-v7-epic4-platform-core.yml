name: SCIIP v7 Epic 4 Platform Core
on:
  push:
    paths:
      - 'src/platform/data/**'
      - 'tools/tests/sciip-epic4-platform-core-test.js'
      - '.github/workflows/sciip-v7-epic4-platform-core.yml'
  pull_request:
    paths:
      - 'src/platform/data/**'
      - 'tools/tests/sciip-epic4-platform-core-test.js'
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run test:epic4:platform-core
