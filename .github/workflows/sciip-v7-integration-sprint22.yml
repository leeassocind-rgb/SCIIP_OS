name: SCIIP v7 Sprint 22 Certification
on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm run test:sprint22
      - run: npm run deployment:compile
