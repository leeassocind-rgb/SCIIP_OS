name: SCIIP v7 Integration Sprint 1 Workspace Wiring
on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run certification:integration-sprint1
      - run: npm run certification:integration-sprint1-workspace-wiring
      - run: npm run deployment:compile:test
      - run: npm run architecture:validate
