name: SCIIP Main Certification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sciip-main-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Governed Production Certification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate workflow policy
        run: npm run ci:workflow-policy

      - name: Validate architecture and governance
        run: npm run governance:ci

      - name: Compile deployment
        run: npm run deployment:compile

      - name: Foundation certification
        run: npm run certification:foundation

      - name: Production certification
        run: npm run certification:production

      - name: API certification
        run: npm run certification:api

      - name: UI certification
        run: npm run certification:ui

      - name: Recovery certification
        run: npm run certification:recovery

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sciip-main-certification-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            governance/**/*.json
            outputs/**/*.json
            outputs/**/*.txt
