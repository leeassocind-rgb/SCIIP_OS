<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{padding:24px;max-width:1280px;margin:auto}
    h1{margin:0 0 6px}.sub{color:#667085;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
    .card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
    .metric{font-size:28px;font-weight:700}.label{font-size:12px;text-transform:uppercase;color:#667085;letter-spacing:.05em}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0;font-size:13px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{background:#fff4e5}.ok{background:#ecfdf3}
    button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#172033;color:#fff;margin-right:8px}.secondary{background:#eef2f6;color:#172033}
  </style>
</head>
<body><div class="wrap">
  <h1>Portfolio Optimization & Capital Allocation</h1>
  <div class="sub">Risk-adjusted property strategy, constrained capital planning, executive approval, and governed execution.</div>
  <div id="metrics" class="grid"></div>
  <div class="panel" style="margin-top:16px"><div class="label">Allocation Plan</div><div id="table">Loading…</div></div>
</div>
<script>
function money(v){return '$'+Number(v||0).toLocaleString();}
function render(d){
  var plans=d.plans||[], p=plans.length?plans[plans.length-1]:null;
  document.getElementById('metrics').innerHTML=[
    ['Analyses',(d.analyses||[]).length],['Plans',plans.length],['Approved',(d.approvals||[]).filter(function(x){return x.status==='APPROVED'}).length],['Audit Events',(d.auditEvents||[]).length]
  ].map(function(x){return '<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>'}).join('');
  if(!p){document.getElementById('table').innerHTML='No allocation plan has been created.';return;}
  document.getElementById('table').innerHTML='<div><b>Budget:</b> '+money(p.budget)+' &nbsp; <b>Allocated:</b> '+money(p.allocatedCapital)+' &nbsp; <b>Remaining:</b> '+money(p.remainingCapital)+'</div><table><thead><tr><th>Property</th><th>Score</th><th>Strategy</th><th>Requested</th><th>Allocated</th><th>Status</th></tr></thead><tbody>'+p.allocations.map(function(a){return '<tr><td>'+a.propertyId+'</td><td>'+a.score+'</td><td><span class="pill">'+a.strategy+'</span></td><td>'+money(a.requested)+'</td><td>'+money(a.allocated)+'</td><td><span class="pill '+(a.status==='FUNDED'?'ok':'warn')+'">'+a.status+'</span></td></tr>'}).join('')+'</tbody></table>';
}
if(window.google&&google.script){google.script.run.withSuccessHandler(render).sciipGetEpic6ExecutivePortfolioOptimizationCapitalAllocation();}
</script></body></html>
