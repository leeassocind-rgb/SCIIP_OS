<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{background:#f8fafc;border-radius:9px;padding:12px}.kpi b{display:block;font-size:24px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,textarea{padding:10px;border:1px solid #ccd4dd;border-radius:7px}button{padding:10px 14px;border:0;border-radius:7px;background:#17202a;color:#fff;cursor:pointer}.danger{background:#9b1c1c}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px}.bar{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#17202a}.refresh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ok{background:#ecfdf3;padding:8px;border-radius:6px}.pending{background:#fff7ed;padding:8px;border-radius:6px}</style></head><body><div class="wrap"><div class="head"><div><h1>Production SuperSheet Commit Console</h1><div class="muted">Governed Build 3F → Build 3D execution</div></div><button onclick="refresh()">Refresh</button></div><div id="app"></div></div><script>
var state=<?= bootstrapJson ?>; function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})} function call(name,args,ok){google.script.run.withSuccessHandler(function(r){ok&&ok(r);refresh()}).withFailureHandler(function(e){alert(e.message||e)})[name].apply(null,args||[])}
function refresh(){call('sciipGetEpic5ProductionCommitConsole',[],function(r){state=r;render()})} function action(id,a){var token=document.getElementById('token-'+id).value,reason=(document.getElementById('reason-'+id)||{}).value||'';call('sciipActionEpic5ProductionCommit',[id,a,{token:token,reason:reason,dryRun:document.getElementById('dry-'+id).checked}])}
function render(){var c=state.counters||{},h='<div class="card grid"><div class="kpi"><span>Total</span><b>'+c.total+'</b></div><div class="kpi"><span>Awaiting token</span><b>'+c.awaitingToken+'</b></div><div class="kpi"><span>Committed</span><b>'+c.committed+'</b></div><div class="kpi"><span>Dry-run</span><b>'+c.dryRunCommitted+'</b></div><div class="kpi"><span>Rolled back</span><b>'+c.rolledBack+'</b></div></div>';(state.executions||[]).forEach(function(x){h+='<div class="card"><div class="row"><h3>'+esc(x.batchId)+'</h3><span class="pill">'+esc(x.status)+'</span></div><div class="muted">'+esc(x.executionId)+' · '+esc(x.propertyId)+'</div><div class="bar"><span style="width:'+Number(x.progress||0)+'%"></span></div><p>'+Number(x.progress||0)+'% complete</p><div class="row"><input id="token-'+x.executionId+'" type="password" placeholder="Certification token"><label><input id="dry-'+x.executionId+'" type="checkbox" checked> Dry run</label><button onclick="action(\''+x.executionId+'\',\'VALIDATE_TOKEN\')">Validate token</button><button onclick="action(\''+x.executionId+'\',\'EXECUTE\')">Execute</button></div><div class="refresh">';Object.keys(x.refresh||{}).forEach(function(k){var v=x.refresh[k];h+='<div class="'+(v==='CONFIRMED'?'ok':'pending')+'"><b>'+esc(k)+'</b><br>'+esc(v)+'</div>'});h+='</div><div class="row" style="margin-top:12px"><input id="reason-'+x.executionId+'" placeholder="Rollback reason"><button class="danger" onclick="action(\''+x.executionId+'\',\'ROLLBACK\')">Rollback</button><button onclick="action(\''+x.executionId+'\',\'DISABLE_COMMIT\')">Disable gate</button></div></div>'});document.getElementById('app').innerHTML=h} render();</script></body></html>
