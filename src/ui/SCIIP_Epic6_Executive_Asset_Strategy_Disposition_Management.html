<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{padding:24px;max-width:1280px;margin:auto}h1{margin:0 0 6px}.sub{color:#667085;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px}.metric{font-size:28px;font-weight:700}.label{font-size:12px;text-transform:uppercase;color:#667085}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
</style></head><body><div class="wrap"><h1>Asset Strategy & Disposition Management</h1><div class="sub">Asset business plans, lease-up, redevelopment, disposition pipelines, accountable actions, and governed execution.</div><div id="metrics" class="grid"></div><div class="panel" style="margin-top:16px"><div class="label">Latest Asset Strategy Plan</div><div id="table">Loading…</div></div></div><script>
function render(d){var plans=d.plans||[],p=plans.length?plans[plans.length-1]:null;document.getElementById('metrics').innerHTML=[['Plans',plans.length],['Disposition Pipelines',(d.dispositionPipelines||[]).length],['Open Actions',(d.actions||[]).filter(function(x){return x.status!=='COMPLETED'}).length],['Milestones',(d.milestones||[]).length]].map(function(x){return '<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>'}).join('');if(!p){document.getElementById('table').innerHTML='No asset strategy plan has been created.';return;}document.getElementById('table').innerHTML='<table><thead><tr><th>Property</th><th>Strategy</th><th>Vacancy</th><th>Hold Return</th><th>Execution Risk</th></tr></thead><tbody>'+p.strategies.map(function(s){return '<tr><td>'+s.propertyId+'</td><td><span class="pill">'+s.strategy+'</span></td><td>'+s.vacancyPct+'%</td><td>'+s.holdReturnPct+'%</td><td>'+s.executionRisk+'</td></tr>'}).join('')+'</tbody></table>';}
if(window.google&&google.script){google.script.run.withSuccessHandler(render).sciipGetEpic6ExecutiveAssetStrategyDispositionManagement();}
</script></body></html>
