<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17212b}.top{padding:24px;background:#111827;color:#fff}.muted{color:#98a2b3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:20px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.label{font-size:12px;color:#667085;text-transform:uppercase}.value{font-size:28px;font-weight:700;margin-top:6px}.section{padding:0 20px 20px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px;border-bottom:1px solid #eaecf0}button{background:#111827;color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2f6;font-size:12px}
</style></head><body>
<div class="top"><h1>Executive Forecasting & Scenario Planning</h1><div class="muted">Forward KPIs, portfolio scenarios, strategic priorities, resources, and executive decisions</div></div>
<div class="grid" id="kpis"></div>
<div class="section"><button onclick="refresh()">Refresh</button></div>
<div class="section"><h2>Portfolio Scenarios</h2><table><thead><tr><th>Scenario</th><th>Type</th><th>Score</th><th>Risk</th><th>Status</th></tr></thead><tbody id="scenarios"></tbody></table></div>
<div class="section"><h2>Strategic Initiatives</h2><table><thead><tr><th>Initiative</th><th>Owner</th><th>Priority</th><th>Progress</th><th>Status</th></tr></thead><tbody id="initiatives"></tbody></table></div>
<div class="section"><h2>Decision Support</h2><div id="decision" class="card"></div></div>
<script>
function refresh(){google.script.run.withSuccessHandler(render).sciipGetEpic6ExecutiveForecastingScenarioPlanning();}
function render(d){var k=[['Forecasts',d.forecasts.length],['Scenarios',d.scenarios.length],['Initiatives',d.initiatives.length],['Decisions',d.decisions.length]];document.getElementById('kpis').innerHTML=k.map(function(x){return '<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>';}).join('');document.getElementById('scenarios').innerHTML=d.scenarios.map(function(x){return '<tr><td>'+x.name+(x.selected?' <span class="pill">SELECTED</span>':'')+'</td><td>'+x.type+'</td><td>'+x.score+'</td><td>'+x.riskScore+'</td><td>'+x.status+'</td></tr>';}).join('')||'<tr><td colspan="5">No scenarios yet.</td></tr>';document.getElementById('initiatives').innerHTML=d.initiatives.map(function(x){return '<tr><td>'+x.title+'</td><td>'+x.owner+'</td><td>'+x.strategicPriority+'</td><td>'+x.progress+'%</td><td>'+x.status+'</td></tr>';}).join('')||'<tr><td colspan="5">No initiatives yet.</td></tr>';var rec=d.recommendations.length?d.recommendations[d.recommendations.length-1]:null;document.getElementById('decision').innerHTML=rec?'<b>Recommendation:</b> '+rec.title+'<br><b>Selected scenario:</b> '+rec.recommendedScenarioId+'<br><b>Confidence:</b> '+rec.confidence+'<br><b>Status:</b> '+rec.status:'No executive recommendation generated.';}
refresh();
</script></body></html>
