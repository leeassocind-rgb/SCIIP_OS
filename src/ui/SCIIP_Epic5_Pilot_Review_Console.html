<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--bg:#071019;--panel:#0d1924;--panel2:#122230;--line:#20364a;--text:#edf5fb;--muted:#8ba3b7;--accent:#66d2ff;--good:#5ee0a0;--warn:#ffcb68;--bad:#ff7d89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#15334a 0,#071019 38%);color:var(--text);font:14px Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:1.4px;font-size:12px}h1{margin:6px 0;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:20px}.card{background:linear-gradient(145deg,rgba(18,34,48,.96),rgba(10,23,34,.96));border:1px solid var(--line);border-radius:14px;padding:17px}.kpi{grid-column:span 3}.full{grid-column:span 12}.value{font-size:27px;font-weight:800;margin-top:8px}.label{text-transform:uppercase;color:var(--muted);font-size:11px;letter-spacing:.8px}.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:12px}button,select,input{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px}button{cursor:pointer;font-weight:700}button.primary{border-color:#32779b;color:var(--accent)}button.danger{border-color:#633442;color:var(--bad)}button:disabled{opacity:.35;cursor:not-allowed}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:rgba(94,224,160,.12);color:var(--good);font-size:11px;font-weight:800}.pill.warn{background:rgba(255,203,104,.12);color:var(--warn)}.pill.bad{background:rgba(255,125,137,.12);color:var(--bad)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:360px}dialog::backdrop{background:rgba(0,0,0,.7)}@media(max-width:900px){.kpi,.full{grid-column:span 12}.wrap{padding:16px}.table{overflow:auto}}
</style></head><body><div class="wrap"><div class="top"><div><div class="eyebrow">SCIIP_OS · EPIC 5 BUILD 3F</div><h1>Pilot Review Console</h1><div class="muted">Row-level review, human approval, checkpoint resume, and governed commit rehearsal.</div></div><button onclick="refresh()">Refresh</button></div><div class="grid"><div class="card kpi"><div class="label">Reviews</div><div class="value" id="total">0</div></div><div class="card kpi"><div class="label">Awaiting Review</div><div class="value" id="awaiting">0</div></div><div class="card kpi"><div class="label">Ready for Commit</div><div class="value" id="ready">0</div></div><div class="card kpi"><div class="label">Warnings</div><div class="value" id="warnings">0</div></div><div class="card full"><div class="toolbar"><div><div class="label">Pilot execution queue</div><div class="muted" id="status">Connected</div></div><div class="actions"><input id="pilotId" placeholder="PILOT-ID"><button class="primary" onclick="importPilot()">Import Pilot</button></div></div><div class="table"><table><thead><tr><th>Source</th><th>Status</th><th>Rows</th><th>Issues</th><th>Checkpoint</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card full"><div class="label">Audit trail</div><div id="audit"></div></div></div></div><script>
let DATA=JSON.parse(<?!= JSON.stringify(bootstrapJson) ?>);const $=id=>document.getElementById(id);function call(name,args){$('status').textContent='Working…';google.script.run.withSuccessHandler(()=>refresh()).withFailureHandler(e=>$('status').textContent='Error: '+(e.message||e))[name].apply(null,args||[])}function refresh(){google.script.run.withSuccessHandler(d=>{DATA=d;render();$('status').textContent='Updated '+new Date().toLocaleTimeString()}).withFailureHandler(e=>$('status').textContent='Error: '+(e.message||e)).sciipGetEpic5PilotReviewConsole()}function importPilot(){const id=$('pilotId').value.trim();if(id)call('sciipImportEpic5PilotForReview',[id])}function action(id,a){let note='';if(a==='APPROVE'||a==='REJECT')note=prompt('Review note')||'';call('sciipActionEpic5PilotReview',[id,a,{note:note}])}function issue(id,index){const disposition=prompt('Disposition: ACCEPT, CORRECT_SOURCE, EXCLUDE_ROW, or ESCALATE','ACCEPT');if(!disposition)return;const note=prompt('Decision note')||'';call('sciipActionEpic5PilotReview',[id,'DECIDE_ISSUE',{issueIndex:index,disposition:disposition,note:note}])}function buttons(r){let b=[];r.issues.forEach((x,i)=>{if(x.disposition==='OPEN'||x.disposition==='ESCALATE')b.push(`<button onclick="issue('${r.reviewId}',${i})">Resolve row ${x.row}</button>`)});if(r.status==='AWAITING_REVIEW'||r.status==='REVIEW_IN_PROGRESS'){b.push(`<button class="primary" onclick="action('${r.reviewId}','APPROVE')">Approve</button>`);b.push(`<button class="danger" onclick="action('${r.reviewId}','REJECT')">Reject</button>`)}if(r.status==='REJECTED'||r.status==='NOT_READY')b.push(`<button onclick="action('${r.reviewId}','RESUME')">Resume</button>`);if(r.status==='APPROVED_FOR_COMMIT_REHEARSAL')b.push(`<button class="primary" onclick="action('${r.reviewId}','COMMIT_REHEARSAL')">Run rehearsal</button>`);return b.join(' ')}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const c=DATA.counters;$('total').textContent=c.total;$('awaiting').textContent=c.awaitingReview;$('ready').textContent=c.readyForCommit;$('warnings').textContent=c.warnings;$('rows').innerHTML=DATA.reviews.map(r=>`<tr><td><b>${esc(r.sourceName)}</b><div class="muted">${esc(r.pilotId)}</div></td><td><span class="pill ${r.status.includes('REJECT')?'bad':r.status.includes('AWAIT')?'warn':''}">${r.status}</span></td><td>${r.valid}/${r.rows} valid</td><td>${r.issues.length} total<br><span class="muted">${r.issues.filter(x=>x.disposition==='OPEN'||x.disposition==='ESCALATE').length} unresolved</span></td><td>${esc(r.checkpoint.phase)}</td><td><div class="actions">${buttons(r)}</div></td></tr>`).join('');$('audit').innerHTML=DATA.audit.slice(0,20).map(a=>`<p><b>${esc(a.event)}</b> <span class="muted">${esc(a.reviewId)} · ${new Date(a.at).toLocaleString()}</span></p>`).join('')}render();
</script></body></html>
