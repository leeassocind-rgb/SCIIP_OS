<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17212b}.top{padding:24px;background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:20px}.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.label{font-size:12px;color:#667085;text-transform:uppercase}.value{font-size:28px;font-weight:700;margin-top:6px}.section{padding:0 20px 20px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px;border-bottom:1px solid #eaecf0}button{background:#111827;color:#fff;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.muted{color:#667085}
</style></head><body>
<div class="top"><h1>Executive Operating Review</h1><div class="muted">Weekly performance, variance, risk, and decision follow-up</div></div>
<div class="grid" id="kpis"></div><div class="section"><button onclick="refresh()">Refresh</button></div>
<div class="section"><h2>Scorecards</h2><table><thead><tr><th>Metric</th><th>Actual</th><th>Target</th><th>Trend</th><th>Status</th></tr></thead><tbody id="scorecards"></tbody></table></div>
<div class="section"><h2>Risks & Follow-ups</h2><div id="detail" class="card"></div></div>
<script>
function refresh(){google.script.run.withSuccessHandler(render).sciipGetEpic6ExecutiveOperatingReview();}
function render(d){var k=[['Reviews',d.reviews.length],['Scorecards',d.scorecards.length],['Open Risks',d.risks.filter(x=>x.status==='OPEN').length],['Open Follow-ups',d.followUps.filter(x=>x.status!=='COMPLETED').length]];document.getElementById('kpis').innerHTML=k.map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');document.getElementById('scorecards').innerHTML=d.scorecards.map(x=>'<tr><td>'+x.label+'</td><td>'+x.actual+'</td><td>'+x.target+'</td><td>'+x.trend+'</td><td>'+x.status+'</td></tr>').join('')||'<tr><td colspan="5">No scorecards yet.</td></tr>';document.getElementById('detail').innerHTML='<b>Variance explanations:</b> '+d.variances.length+' &nbsp; <b>Risks:</b> '+d.risks.length+' &nbsp; <b>Decision follow-ups:</b> '+d.followUps.length+' &nbsp; <b>Reports:</b> '+d.reports.length;}
refresh();
</script></body></html>
