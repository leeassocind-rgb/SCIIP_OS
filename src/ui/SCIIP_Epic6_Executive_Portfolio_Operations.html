<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font:14px Arial;background:#f4f6f8;color:#17212b}.shell{padding:22px;max-width:1400px;margin:auto}h1{margin:0 0 4px}.sub{color:#607080;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border:1px solid #dce3e8;border-radius:10px;padding:16px}.value{font-size:26px;font-weight:700;margin-top:8px}.cols{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0f2}.badge{font-size:11px;font-weight:700}.empty{color:#7a8792;padding:20px}button{padding:8px 12px;border:1px solid #bcc7cf;border-radius:7px;background:white;cursor:pointer}@media(max-width:800px){.cols{grid-template-columns:1fr}}
</style></head><body><div class="shell"><h1>Executive Portfolio Operations</h1><div class="sub">Portfolio health, property exceptions, approvals, campaigns, and governed action routing.</div><button onclick="load()">Refresh</button><div id="kpis" class="grid" style="margin-top:14px"></div><div class="cols"><div class="card"><h3>Property Exception Queue</h3><div id="properties"></div></div><div class="card"><h3>Executive Actions</h3><div id="actions"></div></div></div></div><script>
function esc(v){return String(v==null?'':v).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));}
function render(r){document.getElementById('kpis').innerHTML=r.kpis.map(k=>`<div class="card"><div>${esc(k.label)}</div><div class="value">${esc(k.value)}</div><div class="badge">${esc(k.status)}</div></div>`).join('');document.getElementById('properties').innerHTML=r.exceptions.length?`<table><tr><th>Property</th><th>Score</th><th>Status</th></tr>${r.exceptions.map(p=>`<tr><td>${esc(p.address)}<br><small>${esc(p.market)}</small></td><td>${esc(p.operatingScore)}</td><td>${esc(p.status)}</td></tr>`).join('')}</table>`:'<div class="empty">No property exceptions.</div>';document.getElementById('actions').innerHTML=r.executiveActions.length?r.executiveActions.map(a=>`<div style="padding:10px 0;border-bottom:1px solid #edf0f2"><b>${esc(a.title)}</b><br><small>${esc(a.priority)} · ${esc(a.reason)}</small></div>`).join(''):'<div class="empty">No actions.</div>';}
function load(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>alert(e.message||e)).sciipGetEpic6ExecutivePortfolioOperations({});}load();
</script></body></html>
